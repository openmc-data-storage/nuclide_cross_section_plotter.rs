<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuclide cross section plotter</title>
    <link rel="icon" href="https://raw.githubusercontent.com/shimwell/xsplot.com/refs/heads/main/assets/favicon.ico" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="./style.css">
    <script src="https://cdn.plot.ly/plotly-2.26.0.min.js"></script>
    <script data-goatcounter="https://nuclide-cross-section-plotter.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
    <script type="module" src="./app.js"></script>
</head>
<body>
<main class="container-xxl py-3">
    <h1 class="text-center mb-1">Nuclide Cross Section Plotter</h1>
    <p class="subtitle text-center mb-3">A searchable database of neutron and photon cross sections with interactive plotting by Jon Shimwell. See my other projects on <a href="https://xsplot.com/" target="_blank" rel="noopener">xsplot.com</a></p>

    <div class="table-responsive">
        <table class="table table-dark table-hover align-middle mb-2" id="reactions">
            <thead>
            <tr>
                <th scope="col" title="Tick a row to add it to the plot. Ticked rows stay plotted while you change the filters; Clear plot unticks them all.">Select</th>
                <th scope="col" class="sortable" data-column="element" title="Chemical symbol of the target: the nuclide for neutron data, the element for photon data. Click to sort alphabetically.">Element <i class="fa-solid fa-sort"></i></th>
                <th scope="col" class="sortable" data-column="nucleons" title="Mass number of the target nuclide (protons plus neutrons). m1 marks a metastable state, e.g. 242 m1 is Am-242m. Photon data is per element and has none.">Nucleons <i class="fa-solid fa-sort"></i></th>
                <th scope="col" class="sortable" data-column="reaction" title="The reaction channel in ENDF notation: (n,2n) is a neutron in and two neutrons out, (n,γ) is radiative capture, (n,total) the sum of all channels. (γ,…) are photon interactions.">Reaction <i class="fa-solid fa-sort"></i></th>
                <th scope="col" class="sortable" data-column="mt" title="The ENDF MT number that identifies the reaction: 1 total, 2 elastic, 16 (n,2n), 102 (n,γ), 301 heating, 444 damage energy. 50 to 91 are inelastic scattering to individual levels.">MT <i class="fa-solid fa-sort"></i></th>
                <th scope="col" class="sortable" data-column="library" title="The evaluated nuclear data library the cross section comes from. Use the dropdown to choose which libraries are listed; the same reaction from two libraries is two rows.">Library <i class="fa-solid fa-sort"></i></th>
                <th scope="col" class="sortable" data-column="temperature" title="Temperature at which the cross section was Doppler broadened. 0 K is the unbroadened evaluation and is published for elastic scattering only. Photon cross sections have no temperature.">Temperature <i class="fa-solid fa-sort"></i></th>
            </tr>
            <tr>
                <th></th>
                <th><input class="form-control form-control-sm filter-input" data-column="element" placeholder="e.g. Fe" aria-label="filter element"></th>
                <th><input class="form-control form-control-sm filter-input" data-column="nucleons" placeholder="e.g. 56" aria-label="filter nucleons"></th>
                <th><input class="form-control form-control-sm filter-input" data-column="reaction" placeholder="e.g. (n,2n)" aria-label="filter reaction"></th>
                <th><input class="form-control form-control-sm filter-input" data-column="mt" placeholder="e.g. 16" aria-label="filter MT"></th>
                <th>
                    <button id="library-filter" class="form-select form-select-sm text-start check-filter" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="library-menu">All libraries</button>
                    <div id="library-menu" class="check-menu d-none" role="group" aria-label="libraries to show"></div>
                </th>
                <th>
                    <button id="temperature-filter" class="form-select form-select-sm text-start check-filter" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="temperature-menu">294 K</button>
                    <div id="temperature-menu" class="check-menu d-none" role="group" aria-label="temperatures to show"></div>
                </th>
            </tr>
            </thead>
            <tbody id="rows"></tbody>
        </table>
    </div>
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-3">
        <nav aria-label="reaction pages"><ul id="pagination" class="pagination pagination-sm mb-0"></ul></nav>
        <span id="counter" class="mono">0 selected</span>
    </div>

    <div class="d-flex flex-wrap align-items-center gap-2 toolbar">
        <button id="clear" class="btn btn-outline-light" type="button">Clear plot</button>
        <button id="x-scale" class="btn btn-outline-light" type="button" title="Toggle the energy axis between log and linear">X: log</button>
        <button id="y-scale" class="btn btn-outline-light" type="button" title="Toggle the cross section axis between log and linear">Y: log</button>
        <button id="x-unit" class="btn btn-outline-light" type="button" title="Show energies in eV or MeV (downloads are always in eV)">Energy: eV</button>
        <button id="download-json" class="btn btn-primary" type="button" disabled>Download JSON</button>
        <button id="download-csv" class="btn btn-primary" type="button" disabled>Download CSV</button>
        <span id="busy" class="d-none ms-2" role="status">
            <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span><span id="busy-text">Loading...</span>
        </span>
    </div>
    <div id="notice" class="d-none alert alert-secondary py-2 mt-2 mb-0 small"></div>
    <div id="error" class="d-none alert alert-danger py-2 mt-2 mb-0 small" role="alert"></div>

    <div id="plot" class="mt-3 rounded"></div>
</main>
</body>
</html>
